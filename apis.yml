name: Unisound
description: 'Unisound (云知声) is a Chinese AGI technology company delivering conversational
  AI across smart living and smart healthcare. Its Token Hub MaaS platform exposes
  OpenAI- and Anthropic-compatible APIs for the Unisound U2 agent-native large language
  model and U2-Med medical model, plus U2-ASR speech transcription, U2-TTS synthesis
  and voice cloning, voiceprint, and U1-OCR document parsing services, alongside the
  legacy AI Open Platform WebSocket speech APIs and the Shanhai (UniGPT) LLM WebAPI.'
