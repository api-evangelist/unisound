apis:
- name: Unisound Token Hub API
  description: 'Multi-modal MaaS API for Unisound U2 models: OpenAI-compatible chat
    completions and Anthropic-compatible messages for the U2 and U2-Med LLMs (streaming,
    function calling, structured output, context caching, prefix continuation), WebSocket
    one-shot and real-time speech recognition, asynchronous long-audio transcription
    and long-text speech synthesis via task polling, voiceprint registration and
    lookup, voice cloning and timbre management, asynchronous document parsing and
    information extraction (U1-OCR), and file management. Authenticated with Bearer
    API keys.'
  humanURL: https://maas.unisound.com/docs/api/overview
  baseURL: https://maas-api.unisound.com/v1
  tags:
  - LLM
  - Speech Recognition
  - Text-to-Speech
  - Voice Cloning
  - OCR
  properties:
  - type: Documentation
    url: https://maas.unisound.com/docs
  - type: APIReference
    url: https://maas.unisound.com/docs/api/overview
- name: Unisound Shanhai (UniGPT) LLM WebAPI
  description: 'REST chat-completions WebAPI for the Shanhai (山海 / UniGPT) large
    language model on the Unisound AI Open Platform. POST rest/v1.1/chat/completions
    with signature-based authentication (SHA-256 over appkey + udid + timestamp +
    secret), supporting streaming and non-streaming responses.'
  humanURL: https://ai.unisound.com/doc/unigpt/WebAPI.html
  baseURL: https://unigpt-api.hivoice.cn
  tags:
  - LLM
  - Chat
- name: Unisound AI Open Platform Speech WebAPI
  description: 'WebSocket speech APIs on the Unisound AI Open Platform: one-sentence
    speech recognition (Mandarin, Cantonese, Sichuanese, English; domain models for
    medical, finance, law, and more), real-time transcription, audio file transcription,
    oral evaluation, voiceprint, and speech synthesis. Signature-based authentication
    (SHA-256 over appkey + timestamp + secret); iOS, Android, and HarmonyOS SDKs.'
  humanURL: https://ai.unisound.com/doc/asronesentence/WebAPI.html
  baseURL: wss://ws-osasr.hivoice.cn/v1/asr
  tags:
  - Speech Recognition
  - Text-to-Speech
  - Voice
